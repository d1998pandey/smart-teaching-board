<!DOCTYPE html>
<html lang="en" data-ui-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Physix Smart Board — Pro Teaching Studio for XP-Pen & Windows 11</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root[data-ui-theme="dark"] {
      --ui-bg: #0b0e14;
      --ui-panel: #131822;
      --ui-card: #1c2331;
      --ui-border: #2a3449;
      --ui-text: #f1f5f9;
      --ui-muted: #94a3b8;
      --ui-accent: #3b82f6;
      --ui-accent-glow: rgba(59, 130, 246, 0.35);
      --ui-danger: #ef4444;
      --ui-success: #22c55e;
    }
    :root[data-ui-theme="light"] {
      --ui-bg: #e2e8f0;
      --ui-panel: #ffffff;
      --ui-card: #f1f5f9;
      --ui-border: #cbd5e1;
      --ui-text: #0f172a;
      --ui-muted: #475569;
      --ui-accent: #2563eb;
      --ui-accent-glow: rgba(37, 99, 235, 0.25);
      --ui-danger: #dc2626;
      --ui-success: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--ui-bg);
      color: var(--ui-text);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }

    .top-toolbar {
      height: 50px;
      background: var(--ui-panel);
      border-bottom: 1px solid var(--ui-border);
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      z-index: 40;
      flex-shrink: 0;
      overflow-x: auto;
    }
    .tool-cluster {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .divider {
      width: 1px;
      height: 24px;
      background: var(--ui-border);
      margin: 0 3px;
    }

    .t-btn {
      background: var(--ui-card);
      color: var(--ui-text);
      border: 1px solid var(--ui-border);
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .t-btn:hover { border-color: var(--ui-accent); }
    .t-btn.active {
      background: var(--ui-accent);
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px var(--ui-accent-glow);
    }
    .t-btn.danger:hover { background: var(--ui-danger); color: #fff; border-color: var(--ui-danger); }

    .bg-choice-btn.selected-choice,
    .grid-choice-btn.selected-choice {
      background: rgba(59, 130, 246, 0.22) !important;
      border: 2px solid #38bdf8 !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .mode-pills {
      display: flex;
      background: var(--ui-bg);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--ui-border);
      gap: 3px;
    }
    .mode-pill {
      background: transparent;
      color: var(--ui-muted);
      border: none;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-pill.active { background: var(--ui-accent); color: #fff; }

    .sub-toolbar {
      min-height: 42px;
      background: var(--ui-panel);
      border-bottom: 1px solid var(--ui-border);
      padding: 4px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 35;
      flex-shrink: 0;
    }
    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--ui-border);
      cursor: pointer;
      transition: transform 0.12s;
    }
    .swatch.active {
      transform: scale(1.22);
      border-color: var(--ui-accent);
      box-shadow: 0 0 0 2px var(--ui-panel);
    }
    .width-dot-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--ui-card);
      border: 1px solid var(--ui-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .width-dot-btn.active { border-color: var(--ui-accent); background: var(--ui-accent-glow); }
    .dot-preview { background: var(--ui-text); border-radius: 50%; display: block; }

    .main-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .slide-sidebar {
      width: 220px;
      background: var(--ui-panel);
      border-right: 1px solid var(--ui-border);
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease;
      z-index: 30;
      flex-shrink: 0;
    }
    .slide-sidebar.strip-mode { width: 92px; }
    .slide-sidebar.hidden-mode { width: 0px; border-right: none; overflow: hidden; }

    .sidebar-header {
      padding: 8px 10px;
      border-bottom: 1px solid var(--ui-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--ui-muted);
    }
    .sidebar-slide-actions {
      padding: 6px 8px;
      border-bottom: 1px solid var(--ui-border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }
    .slide-sidebar.strip-mode .sidebar-slide-actions,
    .slide-sidebar.strip-mode .sidebar-header span { display: none; }

    .thumb-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .thumb-card {
      background: var(--ui-card);
      border: 2px solid var(--ui-border);
      border-radius: 8px;
      padding: 5px;
      cursor: pointer;
      position: relative;
      transition: 0.15s;
    }
    .thumb-card:hover { border-color: var(--ui-muted); }
    .thumb-card.active {
      border-color: var(--ui-accent);
      box-shadow: 0 0 0 2px var(--ui-accent-glow);
    }
    .thumb-del-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.92);
      color: #fff;
      border: 1px solid #fca5a5;
      font-size: 0.7rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      opacity: 0.85;
      transition: 0.15s;
    }
    .thumb-del-btn:hover { opacity: 1; transform: scale(1.12); background: #dc2626; }

    .thumb-preview {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .thumb-preview img { width: 100%; height: 100%; object-fit: contain; }
    .thumb-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--ui-muted);
    }

    .board-viewport {
      flex: 1;
      background: var(--ui-bg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #board-stage {
      width: 1920px;
      height: 1080px;
      position: relative;
      transform-origin: center center;
      box-shadow: 0 14px 45px rgba(0, 0, 0, 0.45);
      border-radius: 4px;
      overflow: hidden;
      touch-action: none;
    }
    #board-stage canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #bgCanvas { z-index: 1; }
    #inkCanvas { z-index: 2; }
    #tempCanvas { z-index: 3; cursor: crosshair; }

    .phys-widget {
      position: absolute;
      z-index: 15;
      display: none;
      background: rgba(254, 249, 195, 0.90);
      border: 2px solid #ca8a04;
      color: #1e293b;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
      cursor: move;
      touch-action: none;
    }
    #rulerWidget {
      width: 700px;
      height: 75px;
      top: 450px;
      left: 600px;
      border-radius: 6px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 10px;
    }
    #protractorWidget {
      width: 420px;
      height: 215px;
      top: 380px;
      left: 720px;
      border-radius: 215px 215px 8px 8px;
      display: none;
    }
    .widget-handle {
      position: absolute;
      right: -14px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ui-accent);
      color: #fff;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    #textOverlayBox {
      position: absolute;
      z-index: 20;
      display: none;
      background: rgba(15, 23, 42, 0.94);
      border: 2px solid var(--ui-accent);
      border-radius: 8px;
      padding: 8px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #textOverlayInput {
      background: transparent;
      color: #fff;
      border: 1px dashed var(--ui-border);
      padding: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      min-width: 260px;
      min-height: 48px;
      outline: none;
    }
    .math-symbol-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
      max-width: 360px;
    }
    .sym-chip {
      background: var(--ui-card);
      color: #fff;
      border: 1px solid var(--ui-border);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
    }
    .sym-chip:hover { background: var(--ui-accent); }

    .bottom-nav {
      height: 44px;
      background: var(--ui-panel);
      border-top: 1px solid var(--ui-border);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
      font-size: 0.78rem;
      flex-shrink: 0;
    }
    .mono-stat {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--ui-muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: var(--ui-panel);
      border: 1px solid var(--ui-border);
      border-radius: 14px;
      width: 100%;
      max-width: 700px;
      max-height: 86vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--ui-border);
      padding-bottom: 10px;
    }
    .shortcut-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.8rem;
    }
    .sc-row {
      background: var(--ui-card);
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sc-key {
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      padding: 3px 8px;
      border-radius: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--ui-accent);
      cursor: pointer;
    }

    .deck-item {
      background: var(--ui-card);
      border: 1px solid var(--ui-border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .deck-item.active-deck {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
    }

    #presFloatingPill {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--ui-border);
      border-radius: 99px;
      padding: 6px 12px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 90;
      box-shadow: 0 8px 25px rgba(0,0,0,0.45);
    }

    body.mode-presentation .top-toolbar,
    body.mode-presentation .sub-toolbar,
    body.mode-presentation .bottom-nav,
    body.mode-presentation .slide-sidebar { display: none !important; }
    body.mode-presentation #presFloatingPill { display: flex !important; }
  </style>
</head>
<body class="mode-teaching">

  <!-- Hidden File Inputs -->
  <input type="file" id="fileImportInput" accept=".pdf,.pptx,.ppt,.png,.jpg,.jpeg,.webp,.json" multiple style="display:none" />
  <input type="file" id="imgObjectInput" accept=".png,.jpg,.jpeg,.webp" style="display:none" />

  <!-- TOP COMPACT TOOLBAR -->
  <header class="top-toolbar" id="topToolbar">
    <div class="tool-cluster">
      <button class="t-btn" onclick="cycleSidebarMode()" title="Collapse / Strip / Expand Slide Sidebar (Tab)">
        ☰ Slides
      </button>
      <button class="t-btn" onclick="openDecksModal()" title="Manage & Switch Between Multiple Uploaded PDFs/PPTs/Lessons">
        📚 My Decks (<span id="lblDeckCount">1</span>)
      </button>
      <button class="t-btn" onclick="document.getElementById('fileImportInput').click()" title="Import High-Res PDF, PPTX, or Images">
        📂 Import File
      </button>
      <button class="t-btn" onclick="insertQuickBlankBoard()" title="Insert New Blank Board After Current Slide (B)">
        ➕ Blank Board
      </button>
      <button class="t-btn" id="btnReturnSlide" style="display:none; border-color:#f59e0b; color:#fbbf24;" onclick="returnFromBlankBoard()">
        ↩ Return
      </button>
      <div class="divider"></div>
      <button class="t-btn" onclick="undoStroke()" title="Undo (Ctrl+Z)">↩ Undo</button>
      <button class="t-btn" onclick="redoStroke()" title="Redo (Ctrl+Y)">↪ Redo</button>
    </div>

    <!-- Core Annotation Tools -->
    <div class="tool-cluster">
      <button class="t-btn" id="tool-select" onclick="selectTool('select')" title="Select / Move Inserted Images (V)">🖱️ Select</button>
      <button class="t-btn active" id="tool-pen" onclick="selectTool('pen')" title="Smooth Pressure Pen (P)">✒️ Pen</button>
      <button class="t-btn" id="tool-highlighter" onclick="selectTool('highlighter')" title="Translucent Highlighter (H)">🖍️ Highlight</button>
      <button class="t-btn" id="tool-eraser" onclick="selectTool('eraser')" title="Eraser Tool — Stays on Eraser until you switch tool (E)">🧹 Eraser</button>
      <button class="t-btn" id="tool-laser" onclick="selectTool('laser')" title="Laser Pointer (L)">🔴 Laser</button>
      <button class="t-btn" id="tool-line" onclick="selectTool('line')" title="Lines & Vectors (Ctrl+A = Arrow, Ctrl+L = Straight Line)">📏 Line/Vector</button>
      <button class="t-btn" id="tool-shape" onclick="selectTool('shape')" title="Geometric & Physics Shapes">📐 Shapes</button>
      <button class="t-btn" id="tool-text" onclick="select
